# live-agent deploy config for TaoMate-H3 on vLLM-Omni on two GPUs (USP2, TP1), used by
# `OMNI_GPUS=2 scripts/run_live.sh omni`.
#
# Same as vllm_omni/deploy/taomate_h3_usp2_realtime.yaml of the vllm-omni worktree
# (/data/zhoutaichang/worldmodel/vllm-omni-taomate, branch feat/taomate-h3-realtime, 19762dbf0; D-036 done:
# per-channel FP8, 256 px decoder tiles with 32 px overlap = correct frames, 4.69 s per
# persona request over 100, measured locally) plus `taomate_h3_hold_for_prompt: true` (just-in-time lock, D-028).
# The earlier copy (c3c8089) used 480 px decoder tiles, which render a 16 px lattice.
# `devices` maps ranks to the cards of the canhazgpu reservation, not to physical GPU ids.
pipeline: taomate_h3
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0,1"
    max_num_seqs: 1
    enforce_eager: true
    # Online FP8 for the DiT blocks only: per-channel weight scales with
    # per-token activation scales (validated visually against eager BF16);
    # the layers that map between pixels, tokens and timesteps and the text
    # encoder stay in BF16. The LoRA hooks add their BF16 delta on top.
    quantization:
      transformer:
        method: fp8_per_channel
        ignore:
          - "*patch_proj*"
          - "*condition_proj*"
          - "*time_embedder*"
          - "*token_refiner*"
          - "*final_layer*"
          - "*adaln_proj*"
      text_encoder: null
    model_class_name: TaoMateH3Pipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    step_execution: true
    streaming_output: true
    parallel_config:
      tensor_parallel_size: 1
      sequence_parallel_size: 2
      ulysses_degree: 2
      ring_degree: 1
      text_encoder_tp_size: 2
      vae_patch_parallel_size: 2
      vae_parallel_mode: tile
    default_sampling_params:
      num_inference_steps: 3
      output_type: np
      fps: 24
    model_config:
      taomate_h3_width: 480
      taomate_h3_height: 864
      taomate_h3_seed: 8301
      taomate_h3_audio_kv_reset_requests: 12
      # One packed length per document kind (prompts up to 256 tokens), so
      # the teacher's graphs are keyed by prompt length only.
      taomate_h3_pad_text_tokens: 512
      # Replay the audio teacher's nine forwards from CUDA graphs (one graph
      # per document shape, LRU of taomate_h3_cuda_graph_max_entries).
      taomate_h3_teacher_cuda_graph: true
      # Capture the teacher graphs of prompts with 300-420 tokens during the
      # load-time warmup (3 shapes per token count, about 0.5 s each), so a
      # prompt update never captures inside the stream. Other lengths are
      # captured lazily at the request that first needs them.
      # live-agent teacher prompts are 373-444 tokens (1233 prompts, p99 424, measured locally 2026-09-29): a
      # length outside the captured range is captured mid-stream the first time (a ~2 s stall seen live at 427)
      taomate_h3_teacher_graph_text_lengths: "360-470"
      # Replay the text-only prompt encode of an update from a CUDA graph too
      # (one graph per token count, captured for the same range at load).
      taomate_h3_text_encoder_cuda_graph: true
      # The exact AdaLN projection cache keys on a host digest of the timestep
      # embedding (one device-to-host copy per forward); recompute instead.
      taomate_h3_adaln_cache: false
      # Merge the LoRA delta into a second per-channel FP8 weight set for the
      # student (8 GB per rank); the base weights serve the audio teacher.
      # OFF for the demo (worktree default: on). Merging requantizes W + LoRA delta to per-channel FP8, but the
      # delta is 0.2-0.7% of |W|, below FP8's rounding step: 83-98% of it becomes rounding error (cos 0.26-0.62
      # to the true delta, 9 DiT linears checked on CPU, measured locally), the 3-step student loses its LoRA and
      # the video is ~4.7x less sharp: frame Laplacian variance (median of 24-25 frames, measured locally) 105-110
      # merged vs 497 unmerged, and 500-512 for USP4 BF16 (the ~1500 first quoted was a lattice-era recording,
      # whose 16 px lattice inflates the metric).
      # Unmerged, the FP8 base plus the BF16 LoRA hook costs ~0.12 s per request (worktree note).
      taomate_h3_lora_merge: false
      taomate_h3_hold_for_prompt: true
      # 256 px decoder tiles (the only tile size the decoder renders correctly)
      # with a 32 px minimum overlap: 8 tiles covering 1.26x the canvas instead of
      # the checkpoint's 15 tiles at 64 px overlap covering 2.37x (no seams,
      # checked at the tile borders); halves the decode time.
      taomate_h3_vae_decoder_tile_overlap_min: 32
      taomate_h3_cuda_graph_max_entries: 512
      # Do not set taomate_h3_vae_decoder_tile_size: 480 px decoder tiles render
      # a uniform 16 px lattice over the frame (isolated 2026-09-28); the
      # checkpoint's 256 px tiles are the correct decode.
      # Pack each phase's frames into shared memory on the worker's background
      # thread instead of the step thread (about 45 ms per phase at 480x864).
      # Measured locally: 4.98 -> 4.78 s per 4.958 s request with a constant
      # short prompt (ten requests), prompt updates unaffected.
      step_async_output: true
      ar_diffusion_kv_config:
        gpu_memory_fraction: 0.02
        warmup_cudagraph: true
